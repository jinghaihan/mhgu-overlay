name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify tag version
        run: |
          project_version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Build overlay
        run: make -j2

      - name: Verify overlay package
        run: python3 tools/verify_overlay.py mhgu-overlay.ovl

      - name: Create checksum
        run: sha256sum mhgu-overlay.ovl > mhgu-overlay.ovl.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mhgu-overlay-release
          path: |
            mhgu-overlay.ovl
            mhgu-overlay.ovl.sha256
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8
        with:
          name: mhgu-overlay-release

      - name: Generate release notes
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release files
        run: gh release upload "${GITHUB_REF_NAME}" mhgu-overlay.ovl mhgu-overlay.ovl.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloadable release asset
        run: |
          mkdir release-download
          gh release download "${GITHUB_REF_NAME}" \
            --pattern mhgu-overlay.ovl \
            --dir release-download
          test -s release-download/mhgu-overlay.ovl
          expected_sha="$(cut -d ' ' -f 1 mhgu-overlay.ovl.sha256)"
          actual_sha="$(sha256sum release-download/mhgu-overlay.ovl | cut -d ' ' -f 1)"
          test "${actual_sha}" = "${expected_sha}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
