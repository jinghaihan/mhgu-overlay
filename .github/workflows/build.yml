name: build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated tables
        run: |
          python3 tools/generate_catalog.py
          git diff --exit-code -- source/generated
      - name: Run portable tests
        run: make -f Makefile.host test

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build overlay
        run: make -j2
      - name: Verify overlay package
        run: python3 tools/verify_overlay.py mhgu-overlay.ovl
      - uses: actions/upload-artifact@v7
        with:
          name: mhgu-overlay
          path: mhgu-overlay.ovl
          if-no-files-found: error
          retention-days: 14
